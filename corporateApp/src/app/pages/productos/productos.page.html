<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Productos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="cargando" class="loading-state">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando productos...</p>
  </div>

  <ion-grid *ngIf="!cargando">
    <ion-row class="header">
      <ion-col size="1" class="col-center">ID</ion-col>
      <ion-col size="4">Nombre</ion-col>
      <ion-col size="2" class="col-center">Unidades</ion-col>
      <ion-col size="2" class="col-center">Precio</ion-col>
      <ion-col size="3" class="col-center">Foto</ion-col>
    </ion-row>

    <ion-row *ngFor="let product of products" class="product-row">
      <ion-col size="1" class="col-center">{{product.id}}</ion-col>
      <ion-col size="4" class="col-name">{{product.nombre}}</ion-col>
      <ion-col size="2" class="col-center">{{product.unidades}}</ion-col>
      <ion-col size="2" class="col-center price-tag">{{product.precio}} €</ion-col>
      <ion-col size="3" class="col-center">
        <img [src]="product.foto" [alt]="product.nombre" class="product-thumbnail">
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
